{% load static %}
<div id="heroBanner" class="carousel slide my-2" data-bs-ride="carousel">
      <div class="carousel-inner">
            <div class="carousel-item active">
                  <div class="hero-slide bg-primary text-white d-flex align-items-center justify-content-center"
                        style="height:320px;">
                        <div class="text-center">
                              <h1 class="display-4 fw-bold">🛒 Welcome to OnlineBazar</h1>
                              <p class="lead">Discover thousands of products at unbeatable prices</p>
                              <a href="#products" class="btn btn-warning btn-lg fw-bold">Shop Now</a>
                        </div>
                  </div>
            </div>
            <div class="carousel-item">
                  <div class="hero-slide text-white d-flex align-items-center justify-content-center"
                        style="height:320px;background:linear-gradient(135deg,#1a1a2e,#16213e);">
                        <div class="text-center">
                              <h2 class="display-5 fw-bold">🤖 AI-Powered Recommendations</h2>
                              <p class="lead">Products suggested just for you using Machine Learning</p>
                              <a href="/user/register/" class="btn btn-warning btn-lg fw-bold">Get Started</a>
                        </div>
                  </div>
            </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#heroBanner" data-bs-slide="prev"><span
                  class="carousel-control-prev-icon"></span></button>
      <button class="carousel-control-next" type="button" data-bs-target="#heroBanner" data-bs-slide="next"><span
                  class="carousel-control-next-icon"></span></button>
</div>
