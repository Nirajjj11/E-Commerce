{% load static %}
<nav class="navbar navbar-expand-lg border-bottom shadow-sm bg-primary">
      <div class="container-fluid">
            <a class="navbar-brand fw-bold text-warning" href="{% url 'home' %}">
                  <i class="fas text-warning fa-shopping-bag mx-4 me-2"></i>OnlineBazar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                  <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                  <form class="d-flex mx-auto w-50" method="GET" action="{% url 'search' %}">
                        <input class="form-control me-2" type="search" name="q" placeholder="Search products..."
                              value="{{ request.GET.q }}" />
                        <button class="btn btn-warning fw-bold" type="submit"><i class="fas fa-search"></i></button>
                  </form>
                  <div class="d-flex align-items-center">
                        <!-- Theme Toggle Button -->
                        <button id="themeToggle" class="btn btn-link nav-link me-3 p-0 border-0 text-decoration-none">
                              <i id="themeIcon" class="bi bi-moon-stars-fill fs-5"></i>
                        </button>
                        {% if user.is_authenticated %}
                        <a class="navbar-brand fw-bold " href="{% url 'user_dashboard' %}"> Hi, {{ user.username }} !</a>
                        <form action="{% url 'logout' %}" method="post" class="px-2">
                              {% csrf_token %}
                              <button type="submit" class="btn btn-danger btn-sm w-100">Logout</button>
                        </form>
                        {% else %}
                        <div class="d-flex gap-2">
                              <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">Login</a>
                              <a href="{% url 'signup' %}" class="btn btn-warning btn-sm fw-bold">Signup</a>
                        </div>
                        {% endif %}
                  </div>
            </div>
      </div>
</nav>
