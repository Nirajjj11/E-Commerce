<nav class="navbar navbar-expand-lg border-bottom">
      <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="{% url 'home' %}">SHOP</a>

            <div class="collapse navbar-collapse" id="navbarNav">
                  <ul class="navbar-nav me-auto">
                        {% if user.is_authenticated %}
                        {% if user.is_approved_seller %}
                        <li class="nav-item">
                              <a class="nav-link text-primary" href="{% url 'product_create' %}">
                                    <i class="bi bi-plus-circle"></i> Add Product
                              </a>
                        </li>
                        {% else %}
                        <li class="nav-item">
                              <span class="nav-link text-muted small mt-1">Wait for Admin Approval</span>
                        </li>
                        {% endif %}
                        {% endif %}
                  </ul>

                  <div class="d-flex align-items-center">
                        <!-- Theme Toggle Button -->
                        <button id="themeToggle" class="btn btn-link nav-link me-3 p-0 border-0">
                              <i id="themeIcon" class="bi bi-moon-stars-fill fs-5"></i>
                        </button>

                        {% if user.is_authenticated %}
                        <div class="dropdown">
                              <a class="btn btn-secondary dropdown-toggle" href="#" role="button"
                                    data-bs-toggle="dropdown">
                                    {{ user.username }}
                              </a>
                              <ul class="dropdown-menu dropdown-menu-end">
                                    <li>
                                          <form action="{% url 'logout' %}" method="post">
                                                {% csrf_token %}
                                                <button type="submit" class="dropdown-item">Logout</button>
                                          </form>
                                    </li>
                              </ul>
                        </div>
                        {% else %}
                        <a href="{% url 'login' %}" class="btn btn-outline-primary me-2">Login</a>
                        <a href="{% url 'signup' %}" class="btn btn-primary">Signup</a>
                        {% endif %}
                  </div>
            </div>
      </div>
</nav>
