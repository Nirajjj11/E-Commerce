{% extends "base.html" %}

{% block content %}

<div class="container py-5">

      <div class="card shadow-lg border-0 rounded-4">

            <div class="card-body p-5">

                  <div class="text-center mb-5">

                        <h2 class="fw-bold">
                              Order Tracking
                        </h2>

                        <p class="text-muted">
                              {{ item.product.name }}
                        </p>

                  </div>

                  <div class="timeline">

                        {% for log in item.logs.all %}

                        <div class="timeline-item mb-5">

                              <div class="d-flex">

                                    <div class="me-4">

                                          <div class="bg-success rounded-circle" style="width:20px;height:20px;">
                                          </div>

                                    </div>

                                    <div>

                                          <h5 class="fw-bold">
                                                {{ log.status }}
                                          </h5>

                                          <p class="text-muted">
                                                {{ log.notes }}
                                          </p>

                                          <small class="text-secondary">
                                                {{ log.timestamp }}
                                          </small>

                                    </div>

                              </div>

                        </div>

                        {% endfor %}

                  </div>

            </div>

      </div>

</div>

{% endblock %}
